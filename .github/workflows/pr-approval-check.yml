name: PR Approval Check

on:
  pull_request_review:
    types: [submitted]
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  pull-requests: read
  statuses: write
  contents: read
  members: read

jobs:
  check-approval:
    name: Check Product Engineering Approval
    runs-on: ubuntu-latest
    steps:
      - name: Check for Product Engineering Team Approval
        uses: actions/github-script@v7
        env:
          APPROVAL_ORG: trufflesecurity
          APPROVAL_TEAM: product-eng
          STATUS_CHECK_NAME: pr-approval-check
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            // Check if pull_request payload exists
            if (!context.payload.pull_request) {
              core.setFailed('No pull request found in payload');
              return;
            }

            const pull_number = context.payload.pull_request.number;
            const headSha = context.payload.pull_request.head.sha;

            console.log(`Checking approvals for PR #${pull_number}`);

            try {
              // Get all reviews for the PR
              const { data: reviews } = await github.rest.pulls.listReviews({
                owner,
                repo,
                pull_number,
              });

              console.log(`Found ${reviews.length} total reviews`);

              // Filter for approved reviews
              const approvals = reviews.filter(review => review.state === 'APPROVED');
              console.log(`Found ${approvals.length} approvals`);

              if (approvals.length === 0) {
                await github.rest.repos.createCommitStatus({
                  owner,
                  repo,
                  sha: headSha,
                  state: 'failure',
                  context: process.env.STATUS_CHECK_NAME,
                  description: 'No approvals found',
                });
                core.setFailed('No approvals found for this PR');
                return;
              }

              // Get org and team from environment variables
              const org = process.env.APPROVAL_ORG;
              const parentTeamSlug = process.env.APPROVAL_TEAM;

              let childTeams = [];
              try {
                const { data: teams } = await github.rest.teams.listChildInOrg({
                  org,
                  team_slug: parentTeamSlug,
                });
                childTeams = teams;
                console.log(`Found ${childTeams.length} child teams of ${parentTeamSlug}`);
              } catch (error) {
                console.error(`Error: Could not list child teams: ${error.message}`);
                await github.rest.repos.createCommitStatus({
                  owner,
                  repo,
                  sha: headSha,
                  state: 'failure',
                  context: process.env.STATUS_CHECK_NAME,
                  description: `Cannot verify team membership: ${error.message}`,
                });
                core.setFailed(`Cannot list child teams. This may be a permissions issue.`);
                return;
              }

              // Check if any approver is an active member of product-eng or child teams
              let hasProductEngApproval = false;

              for (const approval of approvals) {
                const username = approval.user.login;
                console.log(`Checking approval from: ${username}`);

                // Check parent team membership
                try {
                  const { data: membership } = await github.rest.teams.getMembershipForUserInOrg({
                    org,
                    team_slug: parentTeamSlug,
                    username,
                  });

                  if (membership.state === 'active') {
                    console.log(`✅ ${username} is an active member of ${org}/${parentTeamSlug}`);
                    hasProductEngApproval = true;
                    break;
                  }
                } catch (error) {
                  console.log(`${username} is not a member of ${org}/${parentTeamSlug}`);
                }

                // Check child team memberships
                for (const childTeam of childTeams) {
                  try {
                    const { data: membership } = await github.rest.teams.getMembershipForUserInOrg({
                      org,
                      team_slug: childTeam.slug,
                      username,
                    });

                    if (membership.state === 'active') {
                      console.log(`✅ ${username} is an active member of ${org}/${childTeam.slug}`);
                      hasProductEngApproval = true;
                      break;
                    }
                  } catch (error) {
                    // Not a member of this child team, continue checking
                  }
                }

                if (hasProductEngApproval) {
                  break;
                }
              }

              // Set commit status based on result
              if (hasProductEngApproval) {
                await github.rest.repos.createCommitStatus({
                  owner,
                  repo,
                  sha: headSha,
                  state: 'success',
                  context: process.env.STATUS_CHECK_NAME,
                  description: 'Approved by product engineering team member',
                });
                console.log('✅ PR has required product engineering approval');
              } else {
                await github.rest.repos.createCommitStatus({
                  owner,
                  repo,
                  sha: headSha,
                  state: 'failure',
                  context: process.env.STATUS_CHECK_NAME,
                  description: 'No approval from product engineering team',
                });
                core.setFailed('No approval from an active member of product engineering team');
              }

            } catch (error) {
              console.error(`Error: ${error.message}`);
              await github.rest.repos.createCommitStatus({
                owner,
                repo,
                sha: headSha,
                state: 'failure',
                context: process.env.STATUS_CHECK_NAME,
                description: `Error checking approvals: ${error.message}`,
              });
              core.setFailed(`Error checking approvals: ${error.message}`);
            }
